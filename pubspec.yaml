name: pilara
description: "Aplikasi Pilara berbasis Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  tflite_flutter: ^0.12.1
  camera: ^0.12.1
  image: ^4.10.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.1
  maps_launcher: ^3.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  image_picker: ^1.2.0
  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/LogoPilara.png
    - assets/images/anorganik.jpg
    - assets/images/organik.jpg
    - assets/images/sampah_b3.jpg
    - assets/images/sampah_lainnya.jpg
    - assets/images/biopori.jpg
    - assets/images/komposter.jpg
    - assets/images/ecoenzim.jpg
    - assets/images/maggot.jpg
    - assets/images/bokashi.jpg
    - assets/images/vermikompos.jpg
    - assets/images/leaf_mold.jpg
    - assets/images/cangkang_telur.jpg
    - assets/images/tanam_langsung.jpg
    - assets/images/pengering.jpg
    - assets/models/model.tflite
    - assets/models/labels.txt
  